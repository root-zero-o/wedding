    <meta property="og:description" content="종현과 근영의 결혼 이야기, 사진, 방명록을 모았어요. 놀러 와서 축하 한마디 남겨주세요!" />

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/images/favicon.png" type="image/png" sizes="44x44" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #26213a;
        --panel-bg: #fffaf0;
        --panel-ink: #26213a;
        --panel-sub: #6b6380;
        --tag-bg: #f3e7cf;
        --pink: #ff5d8f;
        --pink-dark: #d63c6e;
        --gold: #f2c14e;
        --f-head:
          "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --f-body:
          "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --f-px: "Silkscreen", "Courier New", monospace;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --panel-bg: #2d2744;
          --panel-ink: #f7f1ff;
          --panel-sub: #bdb3d6;
          --tag-bg: #3d3559;
        }
      }
      :root[data-theme="dark"] {
        --panel-bg: #2d2744;
        --panel-ink: #f7f1ff;
        --panel-sub: #bdb3d6;
        --tag-bg: #3d3559;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior: none;
        scrollbar-width: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      html,
      body {
        margin: 0;
        background: #26213a;
        color: var(--panel-ink);
        font-family: var(--f-body);
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #spacer {
        height: 1px;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        overflow: clip;
      }
      #bg {
        position: absolute;
        left: 0;
        top: 0;
      }
      #track {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        will-change: transform;
      }
      .zone {
        position: absolute;
        top: 0;
        height: 100%;
      }
      #hero {
        position: fixed;
        z-index: 5;
        pointer-events: none;
      }

      /* pixel boxes */
      .px {
        background: var(--panel-bg);
        color: var(--panel-ink);
        box-shadow:
          0 -4px 0 var(--ink),
          0 4px 0 var(--ink),
          -4px 0 0 var(--ink),
          4px 0 0 var(--ink),
          8px 8px 0 rgba(20, 14, 40, 0.28);
      }
      .px-btn {
        font-family: var(--f-head);
        font-size: 18px;
        border: 0;
        cursor: pointer;
        color: #fff;
        background: var(--pink);
        padding: 10px 18px;
        box-shadow:
          0 -3px 0 var(--ink),
          0 3px 0 var(--ink),
          -3px 0 0 var(--ink),
          3px 0 0 var(--ink),
          inset 0 -4px 0 var(--pink-dark);
      }
      .px-btn:active {
        transform: translateY(2px);
        box-shadow:
          0 -3px 0 var(--ink),
          0 3px 0 var(--ink),
          -3px 0 0 var(--ink),
          3px 0 0 var(--ink),
          inset 0 -2px 0 var(--pink-dark);
      }
      .px-btn:disabled {
        background: #9b93ad;
        cursor: not-allowed;
        box-shadow:
          0 -3px 0 var(--ink),
          0 3px 0 var(--ink),
          -3px 0 0 var(--ink),
          3px 0 0 var(--ink);
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px dashed var(--gold);
        outline-offset: 5px;
      }

      /* nav */
      #nav {
        position: fixed;
        z-index: 10;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 6px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      #nav::-webkit-scrollbar {
        display: none;
      }
      #nav button {
        font-family: var(--f-head);
        font-size: 15px;
        border: 0;
        background: transparent;
        color: var(--panel-ink);
        padding: 6px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      #nav button[aria-current="true"] {
        background: var(--ink);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #nav button[aria-current="true"] {
          background: var(--pink);
        }
      }

      /* content area */
      .area {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--areaTop);
        height: var(--areaH);
      }
      .center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* intro */
      .invite {
        width: min(480px, 86vw);
        padding: 28px 26px 24px;
        text-align: center;
      }
      /* title ribbon */
      .title-sign {
        --rb: var(--pink);
        --rb-dark: var(--pink-dark);
        --rb-hi: #ff8fb2;
        --rb-line: var(--ink);
        position: relative;
        margin: -74px 6px 22px;
        padding: 16px 14px 14px;
        background: var(--rb);
        box-shadow:
          0 -4px 0 var(--rb-line),
          0 4px 0 var(--rb-line),
          -4px 0 0 var(--rb-line),
          4px 0 0 var(--rb-line),
          inset 0 4px 0 var(--rb-hi),
          inset 0 -6px 0 var(--rb-dark),
          8px 8px 0 rgba(20, 14, 40, 0.28);
      }
      .invite h1 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: clamp(42px, 10.5vw, 64px);
        margin: 0 0 4px;
        line-height: 1.1;
        letter-spacing: 2px;
        color: #fff;
        text-shadow:
          -3px 0 var(--rb-line),
          3px 0 var(--rb-line),
          0 -3px var(--rb-line),
          0 3px var(--rb-line),
          -3px -3px var(--rb-line),
          3px -3px var(--rb-line),
          -3px 3px var(--rb-line),
          3px 3px var(--rb-line),
          0 6px var(--rb-line),
          3px 6px var(--rb-line),
          -3px 6px var(--rb-line);
      }
      .invite .lead {
        font-family: var(--f-head);
        font-size: 19px;
        margin: 0;
        letter-spacing: 1px;
        color: #fff;
        text-shadow:
          -2px 0 var(--rb-line),
          2px 0 var(--rb-line),
          0 -2px var(--rb-line),
          0 2px var(--rb-line),
          0 4px var(--rb-line);
      }
      .title-sign .tail {
        position: absolute;
        z-index: -1;
        top: 22px;
        bottom: -18px;
        width: 40px;
        filter: drop-shadow(4px 0 0 var(--rb-line))
          drop-shadow(-4px 0 0 var(--rb-line))
          drop-shadow(0 4px 0 var(--rb-line))
          drop-shadow(0 -4px 0 var(--rb-line));
      }
      .title-sign .tail::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--rb-dark);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 16px 50%);
      }
      .tail.tail-l { left: -26px; }
      .tail.tail-r { right: -26px; transform: scaleX(-1); }
      .title-sign .spark {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--gold);
        box-shadow:
          4px 0 var(--gold),
          -4px 0 var(--gold),
          0 4px var(--gold),
          0 -4px var(--gold);
        animation: twinkle 1.6s steps(1) infinite;
      }
      .spark.s1 { top: -22px; left: 22px; }
      .spark.s2 { top: -14px; right: 34px; animation-delay: 0.5s; }
      .spark.s3 { bottom: -28px; right: -2px; animation-delay: 1s; }
      @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      /* loader */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #26213a;
        transition: opacity 400ms ease-out;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader svg {
        width: 72px;
        height: 64px;
        animation: beat 1s steps(1) infinite;
      }
      #loader p {
        margin: 0;
        font-family: var(--f-px);
        font-size: 14px;
        letter-spacing: 3px;
        color: #ffe9a3;
      }
      @keyframes beat {
        0%, 45%, 100% { transform: scale(1); }
        15% { transform: scale(1.2); }
        30% { transform: scale(1.1); }
      }
      .invite .greeting {
        font-size: 15px;
        line-height: 1.6;
        color: var(--panel-sub);
        margin: 0 0 18px;
      }
      .invite .together {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 6px;
      }
      .invite .together .label {
        font-family: var(--f-head);
        font-size: 16px;
        color: var(--panel-sub);
      }
      .invite .together .num {
        font-family: var(--f-px);
        font-size: clamp(26px, 6vw, 36px);
        letter-spacing: 2px;
        color: var(--pink);
        line-height: 1;
      }
      .hint {
        margin-top: 20px;
        font-family: var(--f-head);
        font-size: 16px;
        color: var(--panel-sub);
      }
      .hint b {
        display: inline-block;
        color: var(--pink);
        animation: nudge 1s steps(2) infinite;
      }
      @keyframes nudge {
        50% {
          transform: translateX(5px);
        }
      }

      /* story */
      .sign {
        position: absolute;
        top: var(--areaTop);
        bottom: var(--groundFromBottom);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(290px, 78vw);
      }
      .sign .board {
        padding: 16px 18px 14px;
        width: 100%;
        margin-top: clamp(0px, 4vh, 40px);
      }
      .sign .post {
        flex: 1;
        width: 10px;
        background: #6b4630;
        box-shadow:
          inset -3px 0 0 #4f3322,
          0 0 0 3px var(--ink);
        margin-top: 4px;
      }
      .sign .when {
        font-family: var(--f-px);
        font-size: 13px;
        color: var(--pink);
      }
      .sign h2 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 24px;
        margin: 4px 0 6px;
      }
      .sign p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        white-space: pre-line;
      }
      .sign .movies {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 12px;
      }
      .sign .movies figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .sign .movies img {
        display: block;
        height: clamp(90px, calc(var(--areaH) * 0.3), 170px);
        width: auto;
        object-fit: cover;
        box-shadow: 0 0 0 3px var(--ink);
      }
      .sign .movies img.large {
        height: clamp(140px, calc(var(--areaH) * 0.5), 300px);
      }
      .sign .movies figcaption {
        font-size: 12px;
        color: var(--panel-sub);
      }

      /* likes shop */
      .shop {
        width: min(620px, 94vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .shop-sign {
        font-family: var(--f-head);
        font-size: 24px;
        padding: 8px 22px;
        background: #2b2340;
        color: #ffe9a3;
        box-shadow:
          0 -3px 0 #120e20,
          0 3px 0 #120e20,
          -3px 0 0 #120e20,
          3px 0 0 #120e20;
      }
      .wall-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px 6px;
        width: 100%;
      }
      .item {
        position: relative;
        background: none;
        border: 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 2px 2px;
        color: inherit;
      }
      .item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        background: #3f2718;
      }
      .item canvas {
        width: var(--itemSize);
        height: var(--itemSize);
        margin-top: 4px;
        transition: transform 0.12s steps(2);
      }
      .item:hover canvas,
      .item[aria-pressed="true"] canvas {
        transform: translateY(-4px) scale(1.06);
      }
      .item .price {
        font-family: var(--f-px);
        font-size: 12px;
        background: #fff3c4;
        color: #5e3a24;
        padding: 2px 8px;
        margin-top: 6px;
        box-shadow:
          0 -2px 0 #5e3a24,
          0 2px 0 #5e3a24,
          -2px 0 0 #5e3a24,
          2px 0 0 #5e3a24;
      }
      .item[aria-pressed="true"] .price {
        background: var(--pink);
        color: #fff;
      }
      .shop-talk {
        width: 100%;
        padding: 12px 16px;
        min-height: 84px;
        font-size: 15px;
        line-height: 1.55;
      }
      .shop-talk h3 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 20px;
        margin: 0 0 2px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .shop-talk .who {
        font-family: var(--f-body);
        font-size: 12px;
        background: var(--tag-bg);
        padding: 2px 8px;
      }
      .shop-talk p {
        margin: 0;
      }

      /* gallery */
      .frame {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .frame button {
        border: 0;
        padding: 10px;
        cursor: zoom-in;
        background: #c8962e;
        box-shadow:
          0 -4px 0 #7a5410,
          0 4px 0 #7a5410,
          -4px 0 0 #7a5410,
          4px 0 0 #7a5410,
          inset 0 0 0 4px #f2c14e,
          10px 10px 0 rgba(40, 20, 60, 0.22);
      }
      .frame canvas {
        display: block;
        width: var(--frameW);
        height: calc(var(--frameW) * 0.75);
      }
      .frame img {
        display: block;
        width: auto;
        height: auto;
        max-width: var(--frameW);
        max-height: var(--frameH);
        background: #ddd;
      }
      .frame .plaque {
        font-family: var(--f-head);
        font-size: 15px;
        background: #fffaf0;
        color: #26213a;
        padding: 3px 12px;
        box-shadow:
          0 -2px 0 #7a5410,
          0 2px 0 #7a5410,
          -2px 0 0 #7a5410,
          2px 0 0 #7a5410;
      }
      .room-title {
        position: absolute;
        top: var(--areaTop);
        transform: translateX(-50%);
        font-family: var(--f-head);
        font-size: 22px;
        color: #4a3a6e;
        white-space: nowrap;
      }
      .room-sub {
        display: block;
        text-align: center;
        font-family: var(--f-body);
        font-size: 14px;
        opacity: 0.75;
      }

      /* guestbook */
      .gb-sign {
        position: absolute;
        transform: translateX(-50%);
        width: min(340px, 84vw);
        padding: 16px 18px;
        text-align: center;
      }
      .gb-sign h2 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 26px;
        margin: 0 0 4px;
      }
      .gb-sign p {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--panel-sub);
      }
      .gb-sign .count {
        font-family: var(--f-px);
        color: var(--pink);
        font-size: 14px;
        margin-bottom: 12px;
      }
      .gb-note {
        font-size: 13px !important;
        margin: 10px 0 0 !important;
      }
      .hold {
        position: absolute;
        transform: translate(-50%, -50%);
        border: 0;
        background: none;
        padding: 2px;
        cursor: pointer;
      }
      .hold canvas {
        display: block;
        width: 36px;
        height: 36px;
      }
      .hold:hover canvas {
        filter: brightness(1.12);
      }
      .hold.new {
        animation: pop 0.5s steps(5);
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -50%) scale(0);
        }
        70% {
          transform: translate(-50%, -50%) scale(1.35);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      .tape {
        position: absolute;
        transform: translate(-50%, -50%);
        font-family: var(--f-px);
        font-size: 11px;
        color: #26213a;
        background: #fff3c4;
        padding: 2px 6px;
        pointer-events: none;
      }
      #bubble {
        position: absolute;
        z-index: 3;
        width: min(260px, 70vw);
        padding: 12px 14px;
        transform: translate(-50%, calc(-100% - 26px));
        display: none;
      }
      #bubble[data-below] {
        transform: translate(-50%, 26px);
      }
      #bubble .n {
        font-family: var(--f-head);
        font-size: 18px;
      }
      #bubble .m {
        font-size: 15px;
        line-height: 1.55;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #bubble .t {
        font-size: 12px;
        color: var(--panel-sub);
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #bubble .del {
        font: inherit;
        font-size: 12px;
        border: 0;
        background: none;
        color: var(--pink);
        cursor: pointer;
        text-decoration: underline;
      }

      /* dialogs */
      dialog {
        border: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        max-width: 94vw;
      }
      dialog::backdrop {
        background: rgba(20, 14, 40, 0.6);
      }
      .dlg {
        padding: 22px;
        width: min(400px, 88vw);
      }
      .dlg h2 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 24px;
        margin: 0 0 4px;
      }
      .dlg p {
        margin: 0 0 14px;
        font-size: 14px;
        color: var(--panel-sub);
      }
      .dlg label {
        display: block;
        font-family: var(--f-head);
        font-size: 16px;
        margin: 10px 0 6px;
      }
      .dlg input,
      .dlg textarea {
        width: 100%;
        font: inherit;
        font-size: 16px;
        padding: 10px;
        border: 0;
        background: var(--tag-bg);
        color: var(--panel-ink);
        box-shadow: inset 0 0 0 3px var(--ink);
      }
      .dlg textarea {
        min-height: 96px;
        resize: vertical;
      }
      .dlg .row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 16px;
        align-items: center;
      }
      .dlg .ghost {
        font-family: var(--f-head);
        font-size: 17px;
        background: none;
        border: 0;
        color: var(--panel-ink);
        cursor: pointer;
        padding: 8px;
      }
      .dlg .err {
        color: var(--pink);
        font-size: 14px;
        margin-top: 10px;
        min-height: 1em;
      }
      .dlg .len {
        font-size: 12px;
        color: var(--panel-sub);
        text-align: right;
        margin-top: 4px;
      }
      #lightbox .dlg {
        width: min(860px, 94vw);
        padding: 14px;
      }
      #lightbox canvas,
      #lightbox img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 76vh;
        object-fit: contain;
        background: #111;
      }
      #lightbox .cap {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        font-family: var(--f-head);
        font-size: 18px;
      }
      #lbCap {
        flex: 1;
      }
      .lb-count {
        font-family: var(--f-px);
        font-size: 13px;
        color: var(--pink);
      }
      .lb-stage {
        position: relative;
      }
      .lb-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border: 0;
        cursor: pointer;
        font-size: 16px;
        color: #fff;
        background: var(--ink);
        box-shadow:
          0 -3px 0 #fff,
          0 3px 0 #fff,
          -3px 0 0 #fff,
          3px 0 0 #fff;
        opacity: 0.85;
      }
      .lb-arrow:hover {
        background: var(--pink);
        opacity: 1;
      }
      .lb-arrow:active {
        transform: translateY(calc(-50% + 2px));
      }
      .lb-arrow.prev {
        left: 12px;
      }
      .lb-arrow.next {
        right: 12px;
      }
      /* maker credit */
      #credit-btn {
        position: fixed;
        z-index: 10;
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        width: 40px;
        height: 40px;
        padding: 0;
        font-family: var(--f-px);
        font-size: 13px;
        letter-spacing: -1px;
      }
      #credit {
        inset: auto;
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
        margin: 0;
        border: 0;
        width: max-content;
        max-width: calc(100vw - 28px);
        padding: 12px 16px;
        font-size: 15px;
        line-height: 1.5;
      }
      #credit p {
        margin: 0 0 6px;
      }
      #credit a {
        font-family: var(--f-px);
        font-size: 12px;
        color: var(--pink);
        word-break: break-all;
      }
      #credit a:focus-visible {
        outline: 3px dashed var(--gold);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .hint b,
        .hold.new,
        .title-sign .spark,
        #loader svg {
          animation: none;
        }
        #loader {
          transition: none;
        }
        .item canvas {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="불러오는 중">
      <svg viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="1" height="1" fill="#d63c6e"/><rect x="2" y="0" width="1" height="1" fill="#d63c6e"/><rect x="6" y="0" width="1" height="1" fill="#d63c6e"/><rect x="7" y="0" width="1" height="1" fill="#d63c6e"/><rect x="0" y="1" width="1" height="1" fill="#d63c6e"/><rect x="1" y="1" width="1" height="1" fill="#fff"/><rect x="2" y="1" width="1" height="1" fill="#fff"/><rect x="3" y="1" width="1" height="1" fill="#d63c6e"/><rect x="5" y="1" width="1" height="1" fill="#d63c6e"/><rect x="6" y="1" width="1" height="1" fill="#ff5d8f"/><rect x="7" y="1" width="1" height="1" fill="#ff5d8f"/><rect x="8" y="1" width="1" height="1" fill="#d63c6e"/><rect x="0" y="2" width="1" height="1" fill="#d63c6e"/><rect x="1" y="2" width="1" height="1" fill="#fff"/><rect x="2" y="2" width="1" height="1" fill="#ff5d8f"/><rect x="3" y="2" width="1" height="1" fill="#ff5d8f"/><rect x="4" y="2" width="1" height="1" fill="#d63c6e"/><rect x="5" y="2" width="1" height="1" fill="#ff5d8f"/><rect x="6" y="2" width="1" height="1" fill="#ff5d8f"/><rect x="7" y="2" width="1" height="1" fill="#ff5d8f"/><rect x="8" y="2" width="1" height="1" fill="#d63c6e"/><rect x="0" y="3" width="1" height="1" fill="#d63c6e"/><rect x="1" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="2" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="3" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="4" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="5" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="6" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="7" y="3" width="1" height="1" fill="#ff5d8f"/><rect x="8" y="3" width="1" height="1" fill="#d63c6e"/><rect x="1" y="4" width="1" height="1" fill="#d63c6e"/><rect x="2" y="4" width="1" height="1" fill="#ff5d8f"/><rect x="3" y="4" width="1" height="1" fill="#ff5d8f"/><rect x="4" y="4" width="1" height="1" fill="#ff5d8f"/><rect x="5" y="4" width="1" height="1" fill="#ff5d8f"/><rect x="6" y="4" width="1" height="1" fill="#ff5d8f"/><rect x="7" y="4" width="1" height="1" fill="#d63c6e"/><rect x="2" y="5" width="1" height="1" fill="#d63c6e"/><rect x="3" y="5" width="1" height="1" fill="#ff5d8f"/><rect x="4" y="5" width="1" height="1" fill="#ff5d8f"/><rect x="5" y="5" width="1" height="1" fill="#ff5d8f"/><rect x="6" y="5" width="1" height="1" fill="#d63c6e"/><rect x="3" y="6" width="1" height="1" fill="#d63c6e"/><rect x="4" y="6" width="1" height="1" fill="#ff5d8f"/><rect x="5" y="6" width="1" height="1" fill="#d63c6e"/><rect x="4" y="7" width="1" height="1" fill="#d63c6e"/></svg>
      <p>LOADING</p>
    </div>
    <noscript><style>#loader{display:none}</style></noscript>
    <div id="spacer"></div>
    <div id="stage">
      <canvas id="bg" aria-hidden="true"></canvas>
      <div id="track">
        <section class="zone" id="z-intro" aria-label="소개">
          <div class="area">
            <div class="center invite px">
              <div class="title-sign">
                <i class="tail tail-l" aria-hidden="true"></i
                ><i class="tail tail-r" aria-hidden="true"></i
                ><i class="spark s1" aria-hidden="true"></i
                ><i class="spark s2" aria-hidden="true"></i
                ><i class="spark s3" aria-hidden="true"></i>
                <h1 id="i-names"></h1>
                <p class="lead" id="i-lead"></p>
              </div>
              <p class="greeting" id="i-greeting"></p>
              <div class="together">
                <span class="label">함께한 날</span>
                <span class="num" id="i-days"></span
                ><span class="label">일</span>
              </div>
              <div class="hint">
                <span id="i-hint">스크롤하면 둘이 같이 걸어가요</span> <b>▶</b>
              </div>
            </div>
          </div>
        </section>
        <section
          class="zone"
          id="z-story"
          aria-label="우리가 만난 이야기"
        ></section>
        <section class="zone" id="z-likes" aria-label="우리가 좋아하는 것">
          <div class="area">
            <div class="center shop">
              <div class="shop-sign">우리가 좋아하는 것들</div>
              <div class="wall-grid" id="items"></div>
              <div class="shop-talk px" id="talk" aria-live="polite">
                <h3>어서 오세요!</h3>
                <p>
                  벽에 걸린 물건을 눌러 보세요. 우리 둘이 좋아하는 것들이에요.
                </p>
              </div>
            </div>
          </div>
        </section>
        <section class="zone" id="z-gallery" aria-label="갤러리"></section>
        <section class="zone" id="z-guest" aria-label="축하 방명록">
          <div class="gb-sign px" id="gbSign">
            <h2>축하 홀드 달기</h2>
            <p>
              한마디 남겨 주시면 벽에 홀드가 하나씩 생겨요. 홀드를 누르면
              메시지를 볼 수 있어요.
            </p>
            <div class="count" id="gbCount">0 HOLDS</div>
            <button class="px-btn" id="gbOpen">축하 한마디 남기기</button>
            <p class="gb-note" id="gbNote" hidden></p>
          </div>
          <div id="holds"></div>
          <div id="bubble" class="px" role="status"></div>
        </section>
      </div>
    </div>
    <canvas id="hero" aria-hidden="true"></canvas>
    <nav id="nav" class="px" aria-label="섹션 이동"></nav>
    <button
      class="px-btn"
      id="credit-btn"
      type="button"
      popovertarget="credit"
      aria-label="만든 사람 정보"
    >
      &lt;/&gt;
    </button>
    <div id="credit" class="px" popover>
      <p>신부가 열심히 만들었어요 🛠</p>
      <a
        href="https://github.com/root-zero-o/wedding"
        target="_blank"
        rel="noopener noreferrer"
        >github.com/root-zero-o/wedding</a
      >
    </div>

    <dialog id="gbDialog">
      <div class="dlg px">
        <h2>축하 한마디</h2>
        <p>남긴 메시지는 이 페이지를 보는 모두에게 보여요.</p>
        <label for="gbName">이름</label>
        <input id="gbName" maxlength="20" autocomplete="nickname" />
        <label for="gbMsg">메시지</label>
        <textarea id="gbMsg" maxlength="160"></textarea>
        <div class="len" id="gbLen">0 / 160</div>
        <div class="err" id="gbErr" role="alert"></div>
        <div class="row">
          <button class="ghost" id="gbCancel" type="button">닫기</button
          ><button class="px-btn" id="gbSend" type="button">홀드 달기</button>
        </div>
      </div>
    </dialog>
    <dialog id="lightbox" aria-label="사진 크게 보기">
      <div class="dlg px">
        <div class="lb-stage">
          <div id="lbMedia"></div>
          <button
            class="lb-arrow prev"
            id="lbPrev"
            type="button"
            aria-label="이전 사진"
          >
            ◀
          </button>
          <button
            class="lb-arrow next"
            id="lbNext"
            type="button"
            aria-label="다음 사진"
          >
            ▶
          </button>
        </div>
        <div class="cap">
          <span id="lbCap"></span>
          <span class="lb-count" id="lbCount"></span>
          <button class="ghost" id="lbClose" type="button">닫기</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
