<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>도윤 ♥ 지아 · 우리 결혼합니다</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #26213a;
        --panel-bg: #fffaf0;
        --panel-ink: #26213a;
        --panel-sub: #6b6380;
        --tag-bg: #f3e7cf;
        --pink: #ff5d8f;
        --pink-dark: #d63c6e;
        --gold: #f2c14e;
        --f-head:
          "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --f-body:
          "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --f-px: "Silkscreen", "Courier New", monospace;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --panel-bg: #2d2744;
          --panel-ink: #f7f1ff;
          --panel-sub: #bdb3d6;
          --tag-bg: #3d3559;
        }
      }
      :root[data-theme="dark"] {
        --panel-bg: #2d2744;
        --panel-ink: #f7f1ff;
        --panel-sub: #bdb3d6;
        --tag-bg: #3d3559;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        margin: 0;
        background: #26213a;
        color: var(--panel-ink);
        font-family: var(--f-body);
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #spacer {
        width: 1px;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        left: 0;
        top: 0;
      }
      #track {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        will-change: transform;
      }
      .zone {
        position: absolute;
        top: 0;
        height: 100%;
      }
      #hero {
        position: fixed;
        z-index: 5;
        pointer-events: none;
      }

      /* pixel boxes */
      .px {
        background: var(--panel-bg);
        color: var(--panel-ink);
        box-shadow:
          0 -4px 0 var(--ink),
          0 4px 0 var(--ink),
          -4px 0 0 var(--ink),
          4px 0 0 var(--ink),
          8px 8px 0 rgba(20, 14, 40, 0.28);
      }
      .px-btn {
        font-family: var(--f-head);
        font-size: 18px;
        border: 0;
        cursor: pointer;
        color: #fff;
        background: var(--pink);
        padding: 10px 18px;
        box-shadow:
          0 -3px 0 var(--ink),
          0 3px 0 var(--ink),
          -3px 0 0 var(--ink),
          3px 0 0 var(--ink),
          inset 0 -4px 0 var(--pink-dark);
      }
      .px-btn:active {
        transform: translateY(2px);
        box-shadow:
          0 -3px 0 var(--ink),
          0 3px 0 var(--ink),
          -3px 0 0 var(--ink),
          3px 0 0 var(--ink),
          inset 0 -2px 0 var(--pink-dark);
      }
      .px-btn:disabled {
        background: #9b93ad;
        cursor: not-allowed;
        box-shadow:
          0 -3px 0 var(--ink),
          0 3px 0 var(--ink),
          -3px 0 0 var(--ink),
          3px 0 0 var(--ink);
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px dashed var(--gold);
        outline-offset: 5px;
      }

      /* nav */
      #nav {
        position: fixed;
        z-index: 10;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 6px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      #nav::-webkit-scrollbar {
        display: none;
      }
      #nav button {
        font-family: var(--f-head);
        font-size: 15px;
        border: 0;
        background: transparent;
        color: var(--panel-ink);
        padding: 6px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      #nav button[aria-current="true"] {
        background: var(--ink);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #nav button[aria-current="true"] {
          background: var(--pink);
        }
      }

      /* content area */
      .area {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--areaTop);
        height: var(--areaH);
      }
      .center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* intro */
      .invite {
        width: min(480px, 86vw);
        padding: 28px 26px 24px;
        text-align: center;
      }
      .invite .date {
        font-family: var(--f-px);
        font-size: clamp(26px, 6vw, 40px);
        letter-spacing: 2px;
        color: var(--pink);
        line-height: 1;
      }
      .invite h1 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: clamp(40px, 10vw, 64px);
        margin: 14px 0 4px;
        line-height: 1.05;
      }
      .invite .lead {
        font-size: 17px;
        margin: 0 0 18px;
      }
      .invite dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        text-align: left;
        margin: 0 auto;
        max-width: 330px;
        font-size: 15px;
        line-height: 1.5;
      }
      .invite dt {
        font-family: var(--f-head);
        color: var(--panel-sub);
      }
      .invite dd {
        margin: 0;
      }
      .hint {
        margin-top: 20px;
        font-family: var(--f-head);
        font-size: 16px;
        color: var(--panel-sub);
      }
      .hint b {
        display: inline-block;
        color: var(--pink);
        animation: nudge 1s steps(2) infinite;
      }
      @keyframes nudge {
        50% {
          transform: translateX(5px);
        }
      }

      /* story */
      .sign {
        position: absolute;
        top: var(--areaTop);
        bottom: var(--groundFromBottom);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(290px, 78vw);
      }
      .sign .board {
        padding: 16px 18px 14px;
        width: 100%;
        margin-top: clamp(0px, 4vh, 40px);
      }
      .sign .post {
        flex: 1;
        width: 10px;
        background: #6b4630;
        box-shadow:
          inset -3px 0 0 #4f3322,
          0 0 0 3px var(--ink);
        margin-top: 4px;
      }
      .sign .when {
        font-family: var(--f-px);
        font-size: 13px;
        color: var(--pink);
      }
      .sign h2 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 24px;
        margin: 4px 0 6px;
      }
      .sign p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
      }

      /* likes shop */
      .shop {
        width: min(620px, 94vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .shop-sign {
        font-family: var(--f-head);
        font-size: 24px;
        padding: 8px 22px;
        background: #2b2340;
        color: #ffe9a3;
        box-shadow:
          0 -3px 0 #120e20,
          0 3px 0 #120e20,
          -3px 0 0 #120e20,
          3px 0 0 #120e20;
      }
      .wall-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px 6px;
        width: 100%;
      }
      .item {
        position: relative;
        background: none;
        border: 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 2px 2px;
        color: inherit;
      }
      .item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        background: #3f2718;
      }
      .item canvas {
        width: var(--itemSize);
        height: var(--itemSize);
        margin-top: 4px;
        transition: transform 0.12s steps(2);
      }
      .item:hover canvas,
      .item[aria-pressed="true"] canvas {
        transform: translateY(-4px) scale(1.06);
      }
      .item .price {
        font-family: var(--f-px);
        font-size: 12px;
        background: #fff3c4;
        color: #5e3a24;
        padding: 2px 8px;
        margin-top: 6px;
        box-shadow:
          0 -2px 0 #5e3a24,
          0 2px 0 #5e3a24,
          -2px 0 0 #5e3a24,
          2px 0 0 #5e3a24;
      }
      .item[aria-pressed="true"] .price {
        background: var(--pink);
        color: #fff;
      }
      .shop-talk {
        width: 100%;
        padding: 12px 16px;
        min-height: 84px;
        font-size: 15px;
        line-height: 1.55;
      }
      .shop-talk h3 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 20px;
        margin: 0 0 2px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .shop-talk .who {
        font-family: var(--f-body);
        font-size: 12px;
        background: var(--tag-bg);
        padding: 2px 8px;
      }
      .shop-talk p {
        margin: 0;
      }

      /* gallery */
      .frame {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .frame button {
        border: 0;
        padding: 10px;
        cursor: zoom-in;
        background: #c8962e;
        box-shadow:
          0 -4px 0 #7a5410,
          0 4px 0 #7a5410,
          -4px 0 0 #7a5410,
          4px 0 0 #7a5410,
          inset 0 0 0 4px #f2c14e,
          10px 10px 0 rgba(40, 20, 60, 0.22);
      }
      .frame canvas,
      .frame img {
        display: block;
        width: var(--frameW);
        height: calc(var(--frameW) * 0.75);
        object-fit: cover;
        background: #ddd;
      }
      .frame .plaque {
        font-family: var(--f-head);
        font-size: 15px;
        background: #fffaf0;
        color: #26213a;
        padding: 3px 12px;
        box-shadow:
          0 -2px 0 #7a5410,
          0 2px 0 #7a5410,
          -2px 0 0 #7a5410,
          2px 0 0 #7a5410;
      }
      .room-title {
        position: absolute;
        top: var(--areaTop);
        transform: translateX(-50%);
        font-family: var(--f-head);
        font-size: 22px;
        color: #4a3a6e;
        white-space: nowrap;
      }

      /* guestbook */
      .gb-sign {
        position: absolute;
        transform: translateX(-50%);
        width: min(340px, 84vw);
        padding: 16px 18px;
        text-align: center;
      }
      .gb-sign h2 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 26px;
        margin: 0 0 4px;
      }
      .gb-sign p {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--panel-sub);
      }
      .gb-sign .count {
        font-family: var(--f-px);
        color: var(--pink);
        font-size: 14px;
        margin-bottom: 12px;
      }
      .gb-note {
        font-size: 13px !important;
        margin: 10px 0 0 !important;
      }
      .hold {
        position: absolute;
        transform: translate(-50%, -50%);
        border: 0;
        background: none;
        padding: 2px;
        cursor: pointer;
      }
      .hold canvas {
        display: block;
        width: 36px;
        height: 36px;
      }
      .hold:hover canvas {
        filter: brightness(1.12);
      }
      .hold.new {
        animation: pop 0.5s steps(5);
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -50%) scale(0);
        }
        70% {
          transform: translate(-50%, -50%) scale(1.35);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }
      .tape {
        position: absolute;
        transform: translate(-50%, -50%);
        font-family: var(--f-px);
        font-size: 11px;
        color: #26213a;
        background: #fff3c4;
        padding: 2px 6px;
        pointer-events: none;
      }
      #bubble {
        position: absolute;
        z-index: 3;
        width: min(260px, 70vw);
        padding: 12px 14px;
        transform: translate(-50%, calc(-100% - 26px));
        display: none;
      }
      #bubble[data-below] {
        transform: translate(-50%, 26px);
      }
      #bubble .n {
        font-family: var(--f-head);
        font-size: 18px;
      }
      #bubble .m {
        font-size: 15px;
        line-height: 1.55;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #bubble .t {
        font-size: 12px;
        color: var(--panel-sub);
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #bubble .del {
        font: inherit;
        font-size: 12px;
        border: 0;
        background: none;
        color: var(--pink);
        cursor: pointer;
        text-decoration: underline;
      }

      /* dialogs */
      dialog {
        border: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        max-width: 94vw;
      }
      dialog::backdrop {
        background: rgba(20, 14, 40, 0.6);
      }
      .dlg {
        padding: 22px;
        width: min(400px, 88vw);
      }
      .dlg h2 {
        font-family: var(--f-head);
        font-weight: 400;
        font-size: 24px;
        margin: 0 0 4px;
      }
      .dlg p {
        margin: 0 0 14px;
        font-size: 14px;
        color: var(--panel-sub);
      }
      .dlg label {
        display: block;
        font-family: var(--f-head);
        font-size: 16px;
        margin: 10px 0 6px;
      }
      .dlg input,
      .dlg textarea {
        width: 100%;
        font: inherit;
        font-size: 16px;
        padding: 10px;
        border: 0;
        background: var(--tag-bg);
        color: var(--panel-ink);
        box-shadow: inset 0 0 0 3px var(--ink);
      }
      .dlg textarea {
        min-height: 96px;
        resize: vertical;
      }
      .dlg .row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 16px;
        align-items: center;
      }
      .dlg .ghost {
        font-family: var(--f-head);
        font-size: 17px;
        background: none;
        border: 0;
        color: var(--panel-ink);
        cursor: pointer;
        padding: 8px;
      }
      .dlg .err {
        color: var(--pink);
        font-size: 14px;
        margin-top: 10px;
        min-height: 1em;
      }
      .dlg .len {
        font-size: 12px;
        color: var(--panel-sub);
        text-align: right;
        margin-top: 4px;
      }
      #lightbox .dlg {
        width: min(860px, 94vw);
        padding: 14px;
      }
      #lightbox canvas,
      #lightbox img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 76vh;
        object-fit: contain;
        background: #111;
      }
      #lightbox .cap {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-family: var(--f-head);
        font-size: 18px;
      }
      @media (prefers-reduced-motion: reduce) {
        .hint b,
        .hold.new {
          animation: none;
        }
        .item canvas {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="spacer"></div>
    <div id="stage">
      <canvas id="bg" aria-hidden="true"></canvas>
      <div id="track">
        <section class="zone" id="z-intro" aria-label="소개">
          <div class="area">
            <div class="center invite px">
              <div class="date" id="i-date"></div>
              <h1 id="i-names"></h1>
              <p class="lead" id="i-lead"></p>
              <dl id="i-info"></dl>
              <div class="hint">
                <span id="i-hint">스크롤하면 둘이 같이 걸어가요</span> <b>▶</b>
              </div>
            </div>
          </div>
        </section>
        <section
          class="zone"
          id="z-story"
          aria-label="우리가 만난 이야기"
        ></section>
        <section class="zone" id="z-likes" aria-label="우리가 좋아하는 것">
          <div class="area">
            <div class="center shop">
              <div class="shop-sign">우리가 좋아하는 것들</div>
              <div class="wall-grid" id="items"></div>
              <div class="shop-talk px" id="talk" aria-live="polite">
                <h3>어서 오세요!</h3>
                <p>
                  벽에 걸린 물건을 눌러 보세요. 우리 둘이 좋아하는 것들이에요.
                </p>
              </div>
            </div>
          </div>
        </section>
        <section class="zone" id="z-gallery" aria-label="갤러리"></section>
        <section class="zone" id="z-guest" aria-label="축하 방명록">
          <div class="gb-sign px" id="gbSign">
            <h2>축하 홀드 달기</h2>
            <p>
              한마디 남겨 주시면 벽에 홀드가 하나씩 생겨요. 홀드를 누르면
              메시지를 볼 수 있어요.
            </p>
            <div class="count" id="gbCount">0 HOLDS</div>
            <button class="px-btn" id="gbOpen">축하 한마디 남기기</button>
            <p class="gb-note" id="gbNote" hidden></p>
          </div>
          <div id="holds"></div>
          <div id="bubble" class="px" role="status"></div>
        </section>
      </div>
    </div>
    <canvas id="hero" aria-hidden="true"></canvas>
    <nav id="nav" class="px" aria-label="섹션 이동"></nav>

    <dialog id="gbDialog">
      <div class="dlg px">
        <h2>축하 한마디</h2>
        <p>남긴 메시지는 이 페이지를 보는 모두에게 보여요.</p>
        <label for="gbName">이름</label>
        <input id="gbName" maxlength="20" autocomplete="nickname" />
        <label for="gbMsg">메시지</label>
        <textarea id="gbMsg" maxlength="160"></textarea>
        <div class="len" id="gbLen">0 / 160</div>
        <div class="err" id="gbErr" role="alert"></div>
        <div class="row">
          <button class="ghost" id="gbCancel" type="button">닫기</button
          ><button class="px-btn" id="gbSend" type="button">홀드 달기</button>
        </div>
      </div>
    </dialog>
    <dialog id="lightbox">
      <div class="dlg px">
        <div id="lbMedia"></div>
        <div class="cap">
          <span id="lbCap"></span
          ><button
            class="ghost"
            id="lbClose"
            type="button"
            style="
              font-family: var(--f-head);
              font-size: 17px;
              background: none;
              border: 0;
              color: inherit;
              cursor: pointer;
            "
          >
            닫기
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
